[package]
name = "lcm-native"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "lcm_native"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
regex = "1"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
