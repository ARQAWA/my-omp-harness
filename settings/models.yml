providers:
  openai-codex:
    modelOverrides:
      gpt-6.1-sol:
        contextWindow: 700000
      gpt-6-luna:
        contextWindow: 700000
      gpt-6-sol:
        contextWindow: 700000
      gpt-5.6-luna:
        contextWindow: 700000
  anthropic:
    modelOverrides:
      claude-opus-5-5:
        contextWindow: 700000
      claude-sonnet-5-5:
        contextWindow: 700000
      claude-haiku-5-5:
        contextWindow: 700000
  # openrouter, minimax-free and the deepseek providers are off in config.yml (disabledProviders) until the owner turns them on.
  openrouter:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    modelOverrides:
      cognitivecomputations/dolphin-mistral-24b-venice-edition:
        contextWindow: 136192
      deepseek/deepseek-v4.1-flash-1017:
        contextWindow: 700000
        compat:
          openRouterRouting:
            order:
            - inference-net
            only:
            - inference-net
    models:
    - id: cognitivecomputations/dolphin-mistral-24b-venice-edition
      name: 'Venice: Uncensored'
      api: openai-completions
      reasoning: false
      input:
      - text
      supportsTools: false
      cost:
        input: 0.2
        output: 0.9
        cacheRead: 0
        cacheWrite: 0
      contextWindow: 136192
      maxTokens: 8192
  minimax-free:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    api: openai-completions
    models:
    - id: minimax/minimax-m3.1-flash:free
      name: MiniMax M3.1 Flash · Free
      reasoning: true
      thinking:
        mode: effort
        efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        defaultLevel: max
        requiresEffort: true
      input:
      - text
      - image
      contextWindow: 700000
      maxTokens: 524288
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
      compat:
        openRouterRouting:
          order:
          - minimax
          only:
          - minimax
  deepseek-inferencenet:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    api: openai-completions
    models:
    - id: deepseek/deepseek-v4.1-flash-1017
      name: DeepSeek V4.1 Flash · InferenceNet
      reasoning: true
      input:
      - text
      contextWindow: 700000
      maxTokens: 65536
      cost:
        input: 0.08
        output: 0.5
        cacheRead: 0.008
        cacheWrite: 0
      compat:
        openRouterRouting:
          order:
          - inference-net
          only:
          - inference-net
  deepseek-together:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    api: openai-completions
    models:
    - id: deepseek/deepseek-v4.1-flash-1017
      name: DeepSeek V4.1 Flash · Together
      reasoning: true
      input:
      - text
      contextWindow: 700000
      maxTokens: 65536
      cost:
        input: 0.3
        output: 1.2
        cacheRead: 0.006
        cacheWrite: 0
      compat:
        openRouterRouting:
          order:
          - together
          only:
          - together
  deepseek-primeintellect:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    api: openai-completions
    models:
    - id: deepseek/deepseek-v4.1-flash-1017
      name: DeepSeek V4.1 Flash · Prime Intellect
      reasoning: true
      input:
      - text
      contextWindow: 700000
      maxTokens: 65536
      cost:
        input: 0.3
        output: 1.2
        cacheRead: 0.006
        cacheWrite: 0
      compat:
        openRouterRouting:
          order:
          - primeintellect
          only:
          - primeintellect
  deepseek-relace:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: OPENROUTER_API_KEY
    api: openai-completions
    models:
    - id: deepseek/deepseek-v4.1-flash-1017
      name: DeepSeek V4.1 Flash · Relace
      reasoning: true
      input:
      - text
      contextWindow: 700000
      maxTokens: 65536
      cost:
        input: 0.05
        output: 0.1
        cacheRead: 0.012
        cacheWrite: 0
      compat:
        openRouterRouting:
          order:
          - relace
          only:
          - relace
