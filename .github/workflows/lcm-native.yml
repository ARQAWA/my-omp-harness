name: lcm-native

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'crates/lcm-native/**'
      - '.github/workflows/lcm-native.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            lib: liblcm_native.dylib
            out: lcm_native.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: lcm_native.dll
            out: lcm_native.win32-x64.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path crates/lcm-native/Cargo.toml
      - run: |
          cp crates/lcm-native/target/${{ matrix.target }}/release/${{ matrix.lib }} ${{ matrix.out }}
          ls -l ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          gh release view lcm >/dev/null 2>&1 || gh release create lcm --title lcm --notes lcm
          gh release upload lcm --clobber dist/lcm_native.darwin-arm64.node dist/lcm_native.win32-x64.node
          gh release edit lcm --notes "my-omp-harness ${GITHUB_SHA::7}"
